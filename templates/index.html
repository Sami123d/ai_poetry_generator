<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Poetry Generator - Gemini Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
            display: none;
        }

        .result h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .poetry-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #555;
            white-space: pre-line;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            background: #fee;
            border-left-color: #e74c3c;
            color: #c0392b;
        }

        .api-key-section {
            background: #f0f8ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #b3d9ff;
        }

        .api-key-section h3 {
            color: #2980b9;
            margin-bottom: 10px;
        }

        .api-key-section p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Poetry Generator</h1>
            <p>Generate beautiful Pakistani poetry using Google Gemini AI</p>
        </div>

        <div class="api-key-section">
            <h3>🔑 API Key Setup</h3>
            <p>Enter your Google Gemini API key to start generating poetry:</p>
            <input type="password" id="apiKey" placeholder="Enter your Gemini API key (AIza...)" />
            <div id="apiStatus" class="status" style="display: none;"></div>
        </div>

        <form id="poetryForm">
            <div class="form-group">
                <label for="poetryType">Poetry Type:</label>
                <select id="poetryType">
                    <option value="recursion">Recursion in Programming</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="love">Love Poetry</option>
                    <option value="nature">Nature Poetry</option>
                    <option value="custom">Custom Topic</option>
                </select>
            </div>

            <div class="form-group" id="customTopicGroup" style="display: none;">
                <label for="customTopic">Custom Topic:</label>
                <input type="text" id="customTopic" placeholder="Enter your custom topic..." />
            </div>

            <div class="form-group">
                <label for="language">Language Style:</label>
                <select id="language">
                    <option value="roman_urdu">Roman Urdu</option>
                    <option value="urdu">Urdu (with translation)</option>
                    <option value="english">English</option>
                </select>
            </div>

            <button type="submit" class="btn" id="generateBtn">
                🎨 Generate Poetry
            </button>
        </form>

        <div id="result" class="result">
            <h3>✨ Generated Poetry:</h3>
            <div id="poetryContent" class="poetry-content"></div>
        </div>
    </div>

    <script>
        // API Key validation
        document.getElementById('apiKey').addEventListener('input', function() {
            const apiKey = this.value;
            const status = document.getElementById('apiStatus');
            
            if (apiKey.length > 0) {
                if (apiKey.startsWith('AIza') && apiKey.length >= 35) {
                    status.textContent = '✅ API Key format looks good!';
                    status.className = 'status success';
                    status.style.display = 'block';
                } else {
                    status.textContent = '❌ Invalid API Key format';
                    status.className = 'status error';
                    status.style.display = 'block';
                }
            } else {
                status.style.display = 'none';
            }
        });

        // Show/hide custom topic field
        document.getElementById('poetryType').addEventListener('change', function() {
            const customGroup = document.getElementById('customTopicGroup');
            if (this.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        });

        // Form submission
        document.getElementById('poetryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const apiKey = document.getElementById('apiKey').value;
            const poetryType = document.getElementById('poetryType').value;
            const customTopic = document.getElementById('customTopic').value;
            const language = document.getElementById('language').value;
            
            if (!apiKey) {
                alert('Please enter your API key first!');
                return;
            }
            
            const generateBtn = document.getElementById('generateBtn');
            const result = document.getElementById('result');
            const poetryContent = document.getElementById('poetryContent');
            
            // Show loading
            generateBtn.disabled = true;
            generateBtn.textContent = '🔄 Generating...';
            result.style.display = 'block';
            poetryContent.innerHTML = '<div class="loading">🤖 AI is creating beautiful poetry for you...</div>';
            
            try {
                const response = await fetch('/generate-poetry', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        apiKey: apiKey,
                        poetryType: poetryType,
                        customTopic: customTopic,
                        language: language
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    poetryContent.textContent = data.poetry;
                    result.className = 'result';
                } else {
                    poetryContent.textContent = 'Error: ' + data.error;
                    result.className = 'result error';
                }
            } catch (error) {
                poetryContent.textContent = 'Error: ' + error.message;
                result.className = 'result error';
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '🎨 Generate Poetry';
            }
        });
    </script>
</body>
</html>
